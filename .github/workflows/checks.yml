name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fixture-only dependencies
        run: python -m pip install pytest PyYAML networkx beautifulsoup4
      - name: Test without network or models
        env:
          PYTHONPATH: src
        run: python -m pytest -q
